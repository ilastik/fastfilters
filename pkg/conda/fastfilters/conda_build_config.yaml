MACOSX_DEPLOYMENT_TARGET:      # [osx]
  - 11.0                       # [osx and arm64]
  - 10.9                       # [osx and x86_64]

python:
  - 3.11
  - 3.12
  - 3.13
pin_run_as_build:
  python: x.x

c_compiler:
  - gcc                        # [linux]
  - clang                      # [osx]
  - vs2022                     # [win and x86_64]
c_compiler_version:            # [unix]
  - 14                         # [linux]
  - 19                         # [osx]
c_stdlib:
  - sysroot                    # [linux]
  - macosx_deployment_target   # [osx]
  - vs                         # [win]
c_stdlib_version:              # [unix]
  - 2.12                       # [linux64]
  - 11.0                       # [osx]
cxx_compiler:
  - gxx                        # [linux]
  - clangxx                    # [osx]
  - vs2022                     # [win]
cxx_compiler_version:          # [unix]
  - 14                         # [linux]
  - 19                         # [osx]
